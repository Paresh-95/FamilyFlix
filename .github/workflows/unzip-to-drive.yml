name: Unzip Drive Archives

# Runs hourly and on manual trigger.
# NOTE: GitHub's cron scheduler is best-effort and may fire several minutes late
# under load — do not rely on it for precise timing.
on:
  schedule:
    - cron: '0 * * * *'   # hourly
  workflow_dispatch:       # manual trigger from the Actions UI

# Prevents a new scheduled run from starting while a previous one is still
# extracting. The in-progress run is NOT cancelled — it finishes normally and
# the queued run takes over afterwards.
concurrency:
  group: unzip-to-drive
  cancel-in-progress: false

jobs:
  unzip:
    name: Scan Downloads and extract zips
    runs-on: ubuntu-latest

    # Hard cap: GitHub-hosted runners allow up to 6 hours per job.
    # Very large zip sets may approach this limit; the script itself caps
    # individual files at 6 GB (zip + extracted output) to protect disk.
    timeout-minutes: 340

    steps:
      # ------------------------------------------------------------------ #
      # 1. Install rclone                                                    #
      # ------------------------------------------------------------------ #
      - name: Install rclone
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      # ------------------------------------------------------------------ #
      # 2. Write rclone config from secret                                   #
      # ------------------------------------------------------------------ #
      - name: Configure rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          # The secret is stored as a base64-encoded rclone.conf
          echo "$RCLONE_CONF" | base64 --decode > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          # Smoke-test: list the remote root (fails fast if credentials are wrong)
          rclone lsd gdrive: --max-depth 1

      # ------------------------------------------------------------------ #
      # 3. Run the extraction script                                         #
      # ------------------------------------------------------------------ #
      - name: Process zip files
        env:
          # Folder in Drive to scan for .zip files
          DRIVE_DOWNLOADS: "gdrive:Downloads"
          # Folder in Drive where extracted folders are uploaded
          DRIVE_MOVIES: "gdrive:MOVIES"
          # Folder in Drive where processed zips are moved (set to "" to delete instead)
          DRIVE_PROCESSED: "gdrive:Downloads/Processed"
          # Maximum size (bytes) of a single zip we'll attempt — 6 GB.
          # Keeps zip + extracted content safely under the ~14 GB runner limit.
          MAX_ZIP_BYTES: "6442450944"
          # Local staging area on the runner
          WORK_DIR: "/tmp/drive-extract"
        run: |
          set -euo pipefail

          mkdir -p "$WORK_DIR"

          echo "=== Scanning $DRIVE_DOWNLOADS for .zip files ==="

          # Collect list of zip files with their sizes (bytes, name)
          # rclone lsjson gives structured JSON; we parse with jq
          zip_json=$(rclone lsjson "$DRIVE_DOWNLOADS" --include "*.zip" --no-recurse 2>/dev/null || echo "[]")

          zip_count=$(echo "$zip_json" | jq 'length')
          echo "Found $zip_count zip file(s)."

          if [[ "$zip_count" -eq 0 ]]; then
            echo "Nothing to do."
            exit 0
          fi

          processed=0
          skipped=0
          failed=0

          # Iterate over each zip entry
          while IFS= read -r entry; do
            name=$(echo "$entry" | jq -r '.Name')
            size=$(echo "$entry" | jq -r '.Size')
            # Strip .zip extension for the destination folder name
            folder="${name%.zip}"

            echo ""
            echo "──────────────────────────────────────────────"
            echo "Processing: $name  ($(numfmt --to=iec-i --suffix=B "$size"))"

            # ── Size check ─────────────────────────────────────────────
            if [[ "$size" -gt "$MAX_ZIP_BYTES" ]]; then
              echo "SKIP: $name is $(numfmt --to=iec-i --suffix=B "$size"), exceeds limit of $(numfmt --to=iec-i --suffix=B "$MAX_ZIP_BYTES"). Leaving in Downloads."
              skipped=$((skipped + 1))
              continue
            fi

            # ── Per-zip work in a subshell so errors don't abort the loop ──
            if (
              set -euo pipefail

              local_zip="$WORK_DIR/$name"
              local_extract="$WORK_DIR/$folder"

              # Download
              echo "  [1/4] Downloading $name from Drive..."
              rclone copy "$DRIVE_DOWNLOADS/$name" "$WORK_DIR/" \
                --progress \
                --stats-one-line \
                --transfers 1

              # Extract (preserves nested folder structure via -d flag)
              echo "  [2/4] Extracting to $local_extract..."
              mkdir -p "$local_extract"
              unzip -q "$local_zip" -d "$local_extract"

              # Upload extracted folder to Movies/<foldername>/
              echo "  [3/4] Uploading $folder to $DRIVE_MOVIES/$folder/ ..."
              rclone copy "$local_extract/" "$DRIVE_MOVIES/$folder/" \
                --progress \
                --stats-one-line \
                --transfers 4

              # Move or delete the original zip
              if [[ -n "${DRIVE_PROCESSED:-}" ]]; then
                echo "  [4/4] Moving $name to $DRIVE_PROCESSED/..."
                rclone moveto "$DRIVE_DOWNLOADS/$name" "$DRIVE_PROCESSED/$name"
              else
                echo "  [4/4] Deleting $name from $DRIVE_DOWNLOADS/..."
                rclone deletefile "$DRIVE_DOWNLOADS/$name"
              fi

              # Clean up runner disk before the next zip
              rm -rf "$local_zip" "$local_extract"
              echo "  Done: $name → $DRIVE_MOVIES/$folder/"
            ); then
              processed=$((processed + 1))
            else
              echo "FAILED: $name could not be processed (see log above). Continuing with next file."
              # Clean up any partial files so disk doesn't fill up
              rm -rf "$WORK_DIR/$name" "$WORK_DIR/$folder"
              failed=$((failed + 1))
            fi

          done < <(echo "$zip_json" | jq -c '.[]')

          echo ""
          echo "══════════════════════════════════════════════"
          echo "Run complete — processed: $processed  skipped: $skipped  failed: $failed"

          # Fail the job if any zip errored (doesn't affect others in the same run)
          if [[ "$failed" -gt 0 ]]; then
            echo "One or more archives failed. Check the log above."
            exit 1
          fi
